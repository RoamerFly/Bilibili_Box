name: Build And Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v1.0.2"
        required: true
        default: "v1.0.2"
        type: string
      release_name:
        description: "Optional release title"
        required: false
        type: string
      release_notes:
        description: "新版本内容，会显示在应用内更新提示和 Release 正文顶部"
        required: false
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create release as draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  APP_NAME: Bilibili_Box
  NODE_VERSION: "22"
  PUBLIC_RELEASE_REPOSITORY: RoamerFly/Bilibili_Box
  BILIBOX_UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDFDQkM3QzkyRTVGQzJGRTUKUldUbEwvemxrbnk4SE5sM2JzZHA1d2F1dDhQUlV1NEI5azBSanhPL2VaUC95eHN3WVJPT1EwVGYK
  DOWNLOAD_GUIDE: |
    ## 下载建议

    - Windows 安装版（推荐大多数用户）：下载 `Bilibili_Box-v*-windows-x64-installer.exe`
    - Windows 便携版（免安装）：下载 `Bilibili_Box-v*-windows-x64-portable.zip`，解压后运行里面的 `Bilibili_Box.exe`
    - macOS Apple Silicon / M 系列：下载 `Bilibili_Box-v*-macos-arm64-installer.dmg`
    - macOS Intel：下载 `Bilibili_Box-v*-macos-x64-installer.dmg`
    - Linux Debian/Ubuntu：下载 `Bilibili_Box-v*-linux-x64-installer.deb`
    - Linux Fedora/openSUSE/RHEL：下载 `Bilibili_Box-v*-linux-x64-installer.rpm`
    - Linux 通用 AppImage：下载 `Bilibili_Box-v*-linux-x64-appimage.AppImage`
    - Linux 通用便携：下载 `Bilibili_Box-v*-linux-x64-portable.tar.gz`

    `.sig` 和 `latest.json` 主要用于自动更新与签名校验，普通安装通常不需要手动下载。

jobs:
  validate:
    name: Validate release configuration
    runs-on: ubuntu-latest
    steps:
      - name: Validate updater configuration
        shell: bash
        run: |
          if [ -z "$BILIBOX_UPDATER_PUBLIC_KEY" ]; then
            echo "::error::Missing embedded updater public key."
            exit 1
          fi

  prepare-public-release:
    name: Prepare public draft release
    needs: validate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: Create or reuse draft release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$PUBLIC_RELEASE_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG_NAME" --repo "$PUBLIC_RELEASE_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != true ]; then
              echo "::error::Public release $TAG_NAME already exists and is not a draft."
              exit 1
            fi
          else
            gh release create "$TAG_NAME" \
              --repo "$PUBLIC_RELEASE_REPOSITORY" \
              --target main \
              --title "Bilibili_Box $TAG_NAME" \
              --draft
          fi

  linux:
    name: Build Linux x64
    needs: prepare-public-release
    runs-on: ubuntu-22.04
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            squashfs-tools \
            wget

      - name: Prepare standalone FFmpeg runtime
        run: chmod +x scripts/prepare-ffmpeg-runtime.sh && ./scripts/prepare-ffmpeg-runtime.sh linux-x64

      - name: Build portable application directory
        run: chmod +x build-linux.sh && ./build-linux.sh

      - name: Build Linux AppImage
        run: npm run tauri -- build --bundles appimage -- --locked

      - name: Verify bundled Linux runtime
        run: |
          for library in libonnxruntime.so libsherpa-onnx-c-api.so libsherpa-onnx-cxx-api.so; do
            test -f "dist_linux/$library"
          done
          test -f dist_linux/THIRD_PARTY_NOTICES.md
          if find dist_linux -maxdepth 1 -type f -name 'bilibili_box_lib.so*' | grep -q .; then
            echo "The private Cargo cdylib must not be included in the Linux package." >&2
            exit 1
          fi
          readelf -d dist_linux/bilibili-box | grep -E 'RPATH|RUNPATH' | grep '\$ORIGIN'
          linux_dependencies="$(ldd dist_linux/bilibili-box)"
          printf '%s\n' "$linux_dependencies" | grep 'libsherpa-onnx-c-api.so'
          if printf '%s\n' "$linux_dependencies" | grep -F 'not found'; then
            echo "Linux executable has unresolved shared library dependencies." >&2
            exit 1
          fi
          test -x dist_linux/env/ffmpeg
          test -x dist_linux/env/ffprobe
          dist_linux/env/ffmpeg -version | head -n 1
          dist_linux/env/ffprobe -version | head -n 1

          mapfile -t appimages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -iname '*.appimage' -print)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux AppImage, found ${#appimages[@]}." >&2
            exit 1
          fi
          appimage="${appimages[0]}"
          chmod +x "$appimage"
          extract_dir="$(mktemp -d)"
          (
            cd "$extract_dir"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )
          app_root="$extract_dir/squashfs-root"
          test -x "$app_root/usr/bin/bilibili-box"
          for library in libonnxruntime.so libsherpa-onnx-c-api.so libsherpa-onnx-cxx-api.so; do
            test -f "$app_root/usr/bin/$library"
          done
          test -f "$app_root/usr/bin/THIRD_PARTY_NOTICES.md"
          test ! -e "$app_root/usr/bin/bilibili_box_lib.so"
          appimage_dependencies="$(ldd "$app_root/usr/bin/bilibili-box")"
          printf '%s\n' "$appimage_dependencies" | grep 'libsherpa-onnx-c-api.so'
          if printf '%s\n' "$appimage_dependencies" | grep -F 'not found'; then
            echo "Linux AppImage has unresolved shared library dependencies." >&2
            exit 1
          fi

      - name: Package Linux assets
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          base="${APP_NAME}-${TAG_NAME}-linux-x64"
          mkdir -p release-assets

          tar -C dist_linux -czf "release-assets/${base}-portable.tar.gz" .
          appimage_path="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -iname '*.appimage' -print -quit)"
          test -n "$appimage_path"
          cp "$appimage_path" "release-assets/${base}-appimage.AppImage"

          package_root="$(mktemp -d)"
          mkdir -p \
            "$package_root/DEBIAN" \
            "$package_root/opt/${APP_NAME}" \
            "$package_root/usr/bin" \
            "$package_root/usr/share/applications"
          cp -a dist_linux/. "$package_root/opt/${APP_NAME}/"
          rm -rf "$package_root/opt/${APP_NAME}/data"
          cat > "$package_root/usr/bin/bilibili-box" <<'SH'
          #!/usr/bin/env sh
          exec /opt/Bilibili_Box/bilibili-box "$@"
          SH
          chmod 755 "$package_root/usr/bin/bilibili-box"
          cat > "$package_root/usr/share/applications/bilibili-box.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Bilibili Box
          Comment=Bilibili desktop media workstation
          Exec=/usr/bin/bilibili-box
          Terminal=false
          Categories=AudioVideo;Network;
          DESKTOP
          installed_size="$(du -sk "$package_root" | cut -f1)"
          cat > "$package_root/DEBIAN/control" <<DEB
          Package: bilibili-box
          Version: ${version}
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: Bilibili Box
          Installed-Size: ${installed_size}
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Description: Bilibili desktop media workstation
          DEB
          dpkg-deb --root-owner-group --build \
            "$package_root" "release-assets/${base}-installer.deb"

          rpm_topdir="$PWD/rpmbuild"
          rpm_source="$(mktemp -d)"
          mkdir -p "$rpm_topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p "$rpm_source/bilibili-box-${version}"
          cp -a "$package_root/opt" "$package_root/usr" \
            "$rpm_source/bilibili-box-${version}/"
          tar -C "$rpm_source" -czf \
            "$rpm_topdir/SOURCES/bilibili-box-${version}.tar.gz" \
            "bilibili-box-${version}"
          cat > "$rpm_topdir/SPECS/bilibili-box.spec" <<RPM
          Name: bilibili-box
          Version: ${version}
          Release: 1%{?dist}
          Summary: Bilibili desktop media workstation
          License: MIT
          BuildArch: x86_64
          Source0: %{name}-%{version}.tar.gz
          Requires: gtk3
          Requires: webkit2gtk4.1

          %description
          Bilibili desktop media workstation.

          %prep
          %setup -q

          %build

          %install
          mkdir -p %{buildroot}
          cp -a opt usr %{buildroot}/

          %files
          /opt/Bilibili_Box
          /usr/bin/bilibili-box
          /usr/share/applications/bilibili-box.desktop
          RPM
          rpmbuild --define "_topdir $rpm_topdir" -bb \
            "$rpm_topdir/SPECS/bilibili-box.spec"
          cp "$rpm_topdir/RPMS/x86_64/"*.rpm \
            "release-assets/${base}-installer.rpm"

          deb_listing="$(dpkg-deb -c "release-assets/${base}-installer.deb")"
          rpm_listing="$(rpm -qpl "release-assets/${base}-installer.rpm")"
          for library in libonnxruntime.so libsherpa-onnx-c-api.so libsherpa-onnx-cxx-api.so; do
            printf '%s\n' "$deb_listing" | grep -F "$library"
            printf '%s\n' "$rpm_listing" | grep -F "$library"
          done
          printf '%s\n' "$deb_listing" | grep -F 'THIRD_PARTY_NOTICES.md'
          printf '%s\n' "$rpm_listing" | grep -F 'THIRD_PARTY_NOTICES.md'
          if printf '%s\n' "$deb_listing" "$rpm_listing" | grep -F 'bilibili_box_lib.so'; then
            echo "The private Cargo cdylib was included in a Linux installer." >&2
            exit 1
          fi

      - name: Upload Linux assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          TAURI_UPDATER_PRIVATE_KEY_VALUE: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_UPDATER_PRIVATE_KEY_PASSWORD_VALUE: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_VALUE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_VALUE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: chmod +x scripts/upload-release-assets.sh && ./scripts/upload-release-assets.sh

  windows:
    name: Build Windows x64
    needs: prepare-public-release
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging dependencies
        shell: pwsh
        run: |
          choco install nsis 7zip -y --no-progress
          if (!(Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            throw "NSIS was not installed to the expected location."
          }

      - name: Prepare standalone FFmpeg runtime
        shell: pwsh
        run: .\scripts\prepare-ffmpeg-runtime.ps1

      - name: Build portable application directory
        shell: pwsh
        run: |
          cmd /c build-windows.bat
          if (Test-Path "dist_windows\bilibili-box.exe") {
            Move-Item "dist_windows\bilibili-box.exe" "dist_windows\Bilibili_Box.exe"
          } elseif (Test-Path "dist_windows\BiliBox.exe") {
            Move-Item "dist_windows\BiliBox.exe" "dist_windows\Bilibili_Box.exe"
          } elseif (!(Test-Path "dist_windows\Bilibili_Box.exe")) {
            throw "Built executable was not found in dist_windows."
          }

      - name: Verify bundled Windows runtime
        shell: pwsh
        run: |
          $requiredSherpaDlls = @(
            "onnxruntime.dll",
            "onnxruntime_providers_shared.dll",
            "sherpa-onnx-c-api.dll",
            "sherpa-onnx-cxx-api.dll"
          )
          foreach ($dll in $requiredSherpaDlls) {
            $path = Join-Path "dist_windows" $dll
            if (!(Test-Path $path)) {
              throw "$dll is missing beside the Windows executable."
            }
            Write-Host ("Verified {0} ({1} bytes)" -f $dll, (Get-Item $path).Length)
          }
          if (Test-Path "dist_windows\bilibili_box_lib.dll") {
            throw "The private Cargo cdylib must not be included in the Windows package."
          }
          if (!(Test-Path "dist_windows\THIRD_PARTY_NOTICES.md")) {
            throw "THIRD_PARTY_NOTICES.md is missing from the Windows portable package."
          }
          $dumpbin = (Get-Command dumpbin.exe -ErrorAction SilentlyContinue).Source
          if (!$dumpbin) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsInstallation = & $vswhere -latest -products * -property installationPath
              $dumpbin = (Get-ChildItem "$vsInstallation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue |
                Sort-Object FullName | Select-Object -Last 1).FullName
            }
          }
          if (!$dumpbin) {
            throw "dumpbin.exe was not found for Windows dependency verification."
          }
          $exeDependencies = & $dumpbin /DEPENDENTS "dist_windows\Bilibili_Box.exe" | Out-String
          if ($exeDependencies -notmatch "sherpa-onnx-c-api\.dll") {
            throw "The Windows executable does not declare sherpa-onnx-c-api.dll as a dependency."
          }
          if ($exeDependencies -match "bilibili_box_lib\.dll") {
            throw "The Windows executable unexpectedly depends on bilibili_box_lib.dll."
          }
          foreach ($tool in @("ffmpeg.exe", "ffprobe.exe")) {
            $path = Join-Path "dist_windows\env" $tool
            if (!(Test-Path $path) -or (Get-Item $path).Length -lt 5MB) {
              throw "$tool is missing or is only a launcher shim."
            }
            $versionOutput = & $path -version 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "$tool cannot run from the packaged directory."
            }
            Write-Host ($versionOutput | Select-Object -First 1)
          }

      - name: Package Windows assets
        shell: pwsh
        run: |
          $base = "${env:APP_NAME}-${env:TAG_NAME}-windows-x64"
          $version = $env:TAG_NAME.TrimStart("v")
          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          Compress-Archive -Path "dist_windows" `
            -DestinationPath "release-assets\$base-portable.zip" -Force
          Copy-Item "dist_windows" "dist_windows_installer" -Recurse
          Remove-Item "dist_windows_installer\data" -Recurse -Force
          $source = (Resolve-Path "dist_windows_installer").Path
          $output = Join-Path (Resolve-Path "release-assets").Path "$base-installer.exe"
          $icon = (Resolve-Path "src-tauri\icons\icon.ico").Path
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) {
            throw "makensis.exe was not found after installation."
          }
          & $makensis `
            "/DAPP_VERSION=$version" `
            "/DSOURCE_DIR=$source" `
            "/DOUTPUT_FILE=$output" `
            "/DICON_SOURCE=$icon" `
            "packaging\windows\installer.nsi"
          if (!(Test-Path $output)) {
            throw "NSIS installer was not generated."
          }
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) {
            throw "7z.exe was not installed for installer-content verification."
          }
          $installerListing = & $sevenZip l $output | Out-String
          foreach ($dll in @(
            "onnxruntime.dll",
            "onnxruntime_providers_shared.dll",
            "sherpa-onnx-c-api.dll",
            "sherpa-onnx-cxx-api.dll"
          )) {
            if ($installerListing -notmatch [regex]::Escape($dll)) {
              throw "$dll is missing from the Windows installer."
            }
          }
          if ($installerListing -match "bilibili_box_lib\.dll") {
            throw "The private Cargo cdylib was included in the Windows installer."
          }
          if ($installerListing -notmatch "THIRD_PARTY_NOTICES\.md") {
            throw "THIRD_PARTY_NOTICES.md is missing from the Windows installer."
          }

      - name: Upload Windows assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          TAURI_UPDATER_PRIVATE_KEY_VALUE: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_UPDATER_PRIVATE_KEY_PASSWORD_VALUE: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_VALUE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_VALUE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: chmod +x scripts/upload-release-assets.sh && ./scripts/upload-release-assets.sh

  macos:
    name: Build macOS ${{ matrix.arch }}
    needs: prepare-public-release
    runs-on: ${{ matrix.runner }}
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure optional Apple signing and notarization
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE_BASE64:-}" ] && \
            [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] && \
            [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            keychain_path="$RUNNER_TEMP/bilibox-signing.keychain-db"
            keychain_password="$(openssl rand -hex 16)"
            security create-keychain -p "$keychain_password" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"
            security unlock-keychain -p "$keychain_password" "$keychain_path"
            certificate_path="$RUNNER_TEMP/apple-signing.p12"
            printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
            security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 -k "$keychain_path"
            security set-key-partition-list -S apple-tool:,apple: \
              -s -k "$keychain_password" "$keychain_path"
            security list-keychains -d user -s "$keychain_path"
            security default-keychain -s "$keychain_path"
            security find-identity -v -p codesigning "$keychain_path"
            echo "APPLE_DEVELOPER_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && \
              [ -n "${APPLE_APP_PASSWORD:-}" ]; then
              echo "APPLE_NOTARIZE_READY=1" >> "$GITHUB_ENV"
              echo "APPLE_NOTARIZE_APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
              echo "APPLE_NOTARIZE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
              echo "APPLE_NOTARIZE_PASSWORD=$APPLE_APP_PASSWORD" >> "$GITHUB_ENV"
              echo "Developer ID signing and notarization credentials configured."
            else
              echo "APPLE_NOTARIZE_READY=0" >> "$GITHUB_ENV"
              echo "::notice::Developer ID signing is configured, but notarization secrets are absent; the DMG is not notarized."
            fi
          else
            echo "APPLE_NOTARIZE_READY=0" >> "$GITHUB_ENV"
            echo "::notice::Apple signing secrets absent; using ad-hoc signing only. Artifacts are not notarized or Gatekeeper-ready."
          fi

      - name: Prepare standalone FFmpeg runtime
        run: chmod +x scripts/prepare-ffmpeg-runtime.sh && ./scripts/prepare-ffmpeg-runtime.sh macos-${{ matrix.arch }}

      - name: Build portable application directory
        run: chmod +x build-macos.sh && ./build-macos.sh

      - name: Verify bundled macOS runtime
        run: |
          sherpa_libs=(
            libonnxruntime.1.27.0.dylib
            libonnxruntime.dylib
            libsherpa-onnx-c-api.dylib
            libsherpa-onnx-cxx-api.dylib
          )
          for library in "${sherpa_libs[@]}"; do
            test -f "dist_macos/$library"
          done
          test -f dist_macos/THIRD_PARTY_NOTICES.md
          if find dist_macos -maxdepth 1 -type f -name 'bilibili_box_lib.dylib' | grep -q .; then
            echo "The private Cargo cdylib must not be included in the macOS package." >&2
            exit 1
          fi
          expected_arch="${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          for library in "${sherpa_libs[@]}"; do
            file "dist_macos/$library" | grep -E "$expected_arch|Universal" >/dev/null || {
              echo "Architecture mismatch for dist_macos/$library (expected $expected_arch)." >&2
              exit 1
            }
          done
          file dist_macos/bilibili-box | grep -E "$expected_arch|Universal" >/dev/null || {
            echo "Architecture mismatch for dist_macos/bilibili-box (expected $expected_arch)." >&2
            exit 1
          }
          otool -L dist_macos/bilibili-box | grep 'libsherpa-onnx-c-api.dylib'
          otool -l dist_macos/bilibili-box | grep -A2 LC_RPATH | grep '@loader_path'
          for library in "${sherpa_libs[@]}"; do
            otool -L "dist_macos/$library" | grep -E 'libonnxruntime|libsherpa-onnx' >/dev/null || {
              echo "Unable to inspect dependencies of dist_macos/$library." >&2
              exit 1
            }
          done
          test -x dist_macos/env/ffmpeg
          test -x dist_macos/env/ffprobe
          dist_macos/env/ffmpeg -version | head -n 1
          dist_macos/env/ffprobe -version | head -n 1

      - name: Package macOS assets
        shell: bash
        run: |
          set -euo pipefail
          base="${APP_NAME}-${TAG_NAME}-macos-${{ matrix.arch }}"
          version="${TAG_NAME#v}"
          app_dir="$RUNNER_TEMP/${APP_NAME}.app"
          dmg_root="$RUNNER_TEMP/dmg-root"
          mkdir -p release-assets "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources"
          cp dist_macos/bilibili-box "$app_dir/Contents/MacOS/bilibili-box"
          macos_runtime_libraries=(
            dist_macos/libonnxruntime.1.27.0.dylib
            dist_macos/libonnxruntime.dylib
            dist_macos/libsherpa-onnx-c-api.dylib
            dist_macos/libsherpa-onnx-cxx-api.dylib
          )
          for library in "${macos_runtime_libraries[@]}"; do
            test -f "$library" || {
              echo "Missing sherpa-onnx shared dylib $library for ${{ matrix.arch }}." >&2
              exit 1
            }
          done
          cp "${macos_runtime_libraries[@]}" "$app_dir/Contents/MacOS/"
          test -f dist_macos/THIRD_PARTY_NOTICES.md
          cp dist_macos/THIRD_PARTY_NOTICES.md "$app_dir/Contents/Resources/THIRD_PARTY_NOTICES.md"
          cp -R dist_macos/env "$app_dir/Contents/MacOS/env"
          cp -R dist_macos/data "$app_dir/Contents/MacOS/data"
          cp src-tauri/icons/icon.icns "$app_dir/Contents/Resources/icon.icns"
          cat > "$app_dir/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Bilibili Box</string>
            <key>CFBundleExecutable</key>
            <string>bilibili-box</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>CFBundleIdentifier</key>
            <string>com.bilibili.box</string>
            <key>CFBundleName</key>
            <string>Bilibili Box</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${version}</string>
            <key>CFBundleVersion</key>
            <string>${version}</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.13</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          chmod +x "$app_dir/Contents/MacOS/bilibili-box" \
            "$app_dir/Contents/MacOS/env/ffmpeg" \
            "$app_dir/Contents/MacOS/env/ffprobe"
          sign_app() {
            if [ -n "${APPLE_DEVELOPER_IDENTITY:-}" ]; then
              for library in "${macos_runtime_libraries[@]}"; do
                codesign --force --options runtime --timestamp \
                  --sign "$APPLE_DEVELOPER_IDENTITY" "$app_dir/Contents/MacOS/$(basename "$library")"
              done
              codesign --force --deep --options runtime --timestamp \
                --sign "$APPLE_DEVELOPER_IDENTITY" "$app_dir"
            else
              echo "::notice::Signing macOS app ad-hoc; this artifact is not notarized or Gatekeeper-ready."
              for library in "${macos_runtime_libraries[@]}"; do
                codesign --force --sign - "$app_dir/Contents/MacOS/$(basename "$library")"
              done
              codesign --force --deep --sign - "$app_dir"
            fi
            codesign --verify --deep --strict --verbose=2 "$app_dir"
          }
          sign_app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$app_dir" "release-assets/${base}-portable.zip"
          portable_listing="$(unzip -Z1 "release-assets/${base}-portable.zip")"
          for library in \
            libonnxruntime.1.27.0.dylib \
            libonnxruntime.dylib \
            libsherpa-onnx-c-api.dylib \
            libsherpa-onnx-cxx-api.dylib; do
            printf '%s\n' "$portable_listing" | grep -F "Contents/MacOS/$library"
          done
          printf '%s\n' "$portable_listing" | grep -F 'Contents/Resources/THIRD_PARTY_NOTICES.md'
          rm -rf "$app_dir/Contents/MacOS/data"
          sign_app
          mkdir -p "$dmg_root"
          cp -R "$app_dir" "$dmg_root/"
          ln -s /Applications "$dmg_root/Applications"
          dmg_path="release-assets/${base}-installer.dmg"
          for attempt in 1 2 3; do
            rm -f "$dmg_path"
            if hdiutil create -volname "Bilibili Box" -srcfolder "$dmg_root" \
              -ov -format UDZO "$dmg_path"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to create macOS DMG after ${attempt} attempts." >&2
              exit 1
            fi
            echo "hdiutil reported a temporary failure; retrying (${attempt}/3)." >&2
            sleep 5
          done
          if [ "${APPLE_NOTARIZE_READY:-0}" = 1 ]; then
            xcrun notarytool submit "$dmg_path" \
              --apple-id "$APPLE_NOTARIZE_APPLE_ID" \
              --team-id "$APPLE_NOTARIZE_TEAM_ID" \
              --password "$APPLE_NOTARIZE_PASSWORD" \
              --wait
            xcrun stapler staple "$dmg_path"
            xcrun stapler validate "$dmg_path"
            echo "Developer ID signed and notarized DMG created."
          elif [ -n "${APPLE_DEVELOPER_IDENTITY:-}" ]; then
            echo "::notice::Developer ID signed DMG is not notarized because Apple notarization secrets are absent."
          else
            echo "::notice::Ad-hoc signed DMG is not notarized and is not Gatekeeper-ready."
          fi
          mount_point="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg_path" >/dev/null
          for library in \
            libonnxruntime.1.27.0.dylib \
            libonnxruntime.dylib \
            libsherpa-onnx-c-api.dylib \
            libsherpa-onnx-cxx-api.dylib; do
            test -f "$mount_point/${APP_NAME}.app/Contents/MacOS/$library"
          done
          test -f "$mount_point/${APP_NAME}.app/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test ! -e "$mount_point/${APP_NAME}.app/Contents/MacOS/bilibili_box_lib.dylib"
          hdiutil detach "$mount_point" >/dev/null

      - name: Upload macOS assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          TAURI_UPDATER_PRIVATE_KEY_VALUE: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_UPDATER_PRIVATE_KEY_PASSWORD_VALUE: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_VALUE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_VALUE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: chmod +x scripts/upload-release-assets.sh && ./scripts/upload-release-assets.sh

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows
      - macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets from public draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG_NAME" \
            --repo "$PUBLIC_RELEASE_REPOSITORY" \
            --dir release-assets

      - name: List release assets
        run: ls -lh release-assets

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          INPUT_RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag_name }}"
            release_name="${{ inputs.release_name }}"
            prerelease="${{ inputs.prerelease }}"
            draft="${{ inputs.draft }}"
          else
            tag_name="${GITHUB_REF_NAME}"
            release_name=""
            prerelease="false"
            draft="false"
          fi
          if [ -z "$release_name" ]; then
            release_name="Bilibili_Box ${tag_name}"
          fi
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          notes_file="$RUNNER_TEMP/release-notes.md"
          body_file="$RUNNER_TEMP/release-body.md"
          if [ -n "$INPUT_RELEASE_NOTES" ]; then
            printf '%s\n' "$INPUT_RELEASE_NOTES" > "$notes_file"
          elif [ -f "docs/version-updates.md" ]; then
            cat "docs/version-updates.md" > "$notes_file"
          else
            {
              printf '%s\n' "## 新版本内容 ($tag_name)"
              printf '\n%s\n' '### 新增与优化'
              printf '\n%s\n' '- 体验优化与问题修复。'
            } > "$notes_file"
          fi
          cat "$notes_file" > "$body_file"
          if ! grep -q '^## 下载建议[[:space:]]*$' "$notes_file"; then
            printf '\n%s\n' "$DOWNLOAD_GUIDE" >> "$body_file"
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          echo "body_file=$body_file" >> "$GITHUB_OUTPUT"

      - name: Generate updater metadata
        shell: bash
        env:
          RELEASE_REPOSITORY: ${{ env.PUBLIC_RELEASE_REPOSITORY }}
          RELEASE_ASSET_DIR: release-assets
          RELEASE_TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_NOTES_FILE: ${{ steps.meta.outputs.notes_file }}
        run: node scripts/finalize-updater-metadata.mjs

      - name: Validate updater metadata URLs
        shell: bash
        env:
          RELEASE_REPOSITORY: ${{ env.PUBLIC_RELEASE_REPOSITORY }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const metadata = JSON.parse(await readFile("release-assets/latest.json", "utf8"));
          const expectedPrefix = `https://github.com/${process.env.RELEASE_REPOSITORY}/releases/download/`;
          const urls = [
            ...Object.values(metadata.platforms || {}).map((platform) => platform.url),
            ...(metadata.artifacts || []).map((artifact) => artifact.url),
          ];

          if (urls.length === 0 || urls.some((url) => !url.startsWith(expectedPrefix))) {
            throw new Error(`latest.json contains a non-public release URL; expected prefix ${expectedPrefix}`);
          }
          console.log(`Validated ${urls.length} public updater URLs.`);
          NODE

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          RELEASE_NOTES_FILE: ${{ steps.meta.outputs.body_file }}
          RELEASE_DRAFT: ${{ steps.meta.outputs.draft }}
          RELEASE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" release-assets/latest.json \
            --repo "$PUBLIC_RELEASE_REPOSITORY" \
            --clobber
          edit_args=(
            "$TAG_NAME"
            --repo "$PUBLIC_RELEASE_REPOSITORY"
            --title "$RELEASE_NAME"
            --notes-file "$RELEASE_NOTES_FILE"
          )
          if [ "$RELEASE_DRAFT" = true ]; then
            edit_args+=(--draft)
          else
            edit_args+=(--draft=false)
          fi
          if [ "$RELEASE_PRERELEASE" = true ]; then
            edit_args+=(--prerelease)
          else
            edit_args+=(--prerelease=false)
          fi
          gh release edit "${edit_args[@]}"
