[package]
name = "bilibili-box"
version = "1.2.0"
description = "BiliBox - Bilibili 媒体工作站"
authors = ["BiliBox"]
license-file = "../LICENSE"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bilibili_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 核心
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"

# 序列化
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# 日志
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "time", "local-time"] }

# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli", "stream", "default-tls", "system-proxy"] }
reqwest-retry = "0.7"
reqwest-middleware = "0.4"

# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "time"] }
futures-util = "0.3"

# 类型安全的 IPC
specta = "=2.0.0-rc.20"
tauri-specta = { version = "=2.0.0-rc.20", features = ["derive", "typescript"] }
specta-typescript = "=0.0.7"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 正则表达式
regex = "1"
scraper = "0.23"

# 错误处理
thiserror = "1"

# 路径处理
dirs = "6"

# UUID
uuid = { version = "1", features = ["v4"] }

# 并发控制
parking_lot = "0.12"

# Protocol Buffers (弹幕)
prost = "0.14"
bytes = "1"

# MD5/哈希
md-5 = "0.10"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
minisign-verify = "0.2.5"

# 懒初始化
once_cell = "1"

# 跨平台系统凭据存储（AI API key）
# Linux 同时启用 native + sync-secret-service 时，keyring 官方默认选择
# Secret Service；crypto-rust 避免额外的 OpenSSL 加密构建依赖。
keyring = { version = "3.6.3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native",
    "sync-secret-service",
    "crypto-rust",
] }

# URL 编码
serde_urlencoded = "0.7"
url = "2"

# FFmpeg 集成
ffmpeg-sidecar = "1.1"

# Local SenseVoice ASR. Use the official shared runtime so the Windows
# toolchain does not need to link the prebuilt static MSVC archive. The
# sherpa-onnx build script copies the matching runtime libraries beside each
# Cargo profile executable and emits platform-appropriate runtime paths.
sherpa-onnx = { version = "=1.13.4", default-features = false, features = ["shared"] }
# Pin the native FFI package too; sherpa-onnx's semver range otherwise floats
# to a newer native archive and makes reproducible CI builds impossible.
sherpa-onnx-sys = { version = "=1.13.4", default-features = false, features = ["shared"] }

# Model archive management and disk-space checks.
tar = "0.4"
bzip2 = "0.4"
fs2 = "0.4"
